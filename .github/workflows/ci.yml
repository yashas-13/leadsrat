name: CI

on:
  push:
    branches:
      - main
      - "sync/**"
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run regression tests
        run: pytest -q
      - name: Test frontend reminder behavior
        run: node --test tests/frontend_features.test.js
      - name: Compile Python
        run: python -m py_compile app/main.py
      - name: Validate PWA manifest
        run: python -m json.tool app/static/manifest.webmanifest > /dev/null
      - name: Validate frontend JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('app/static/index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Inline script not found');
          new Function(match[1]);
          console.log('Frontend JavaScript syntax: PASS');
          NODE
      - name: Build production image
        run: docker build --tag leadsrat-ci .
