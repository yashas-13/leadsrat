services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadsrat
      POSTGRES_USER: leadsrat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - leadsrat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadsrat -d leadsrat"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://leadsrat:${POSTGRES_PASSWORD}@db:5432/leadsrat
      LEADSRAT_API_KEY: ${LEADSRAT_API_KEY:?Set LEADSRAT_API_KEY in .env}
      LEADSRAT_ADMIN_PASSWORD: ${LEADSRAT_ADMIN_PASSWORD:?Set LEADSRAT_ADMIN_PASSWORD in .env}
      APP_ENV: production
    ports:
      - "127.0.0.1:8787:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  internal:
    driver: bridge
volumes:
  leadsrat_pgdata:
